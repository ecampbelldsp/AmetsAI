[project]
name = "stt"
version = "0.1.0"
description = "A simple Speech-to-Text application."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "fastapi>=0.136.3",
    "faster-whisper>=1.2.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jiwer>=4.0.0",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "librosa>=0.11.0",
    "openai-whisper>=20250625",
    "pandas-stubs~=3.0.1",
    "peft>=0.18.1",
    "pip>=26.0.1",
    "pyannote-audio>=4.0.4",
    "sentence-transformers>=5.7.0",
    "setuptools-rust>=1.12.0",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchcodec>=0.10.0",
    "transformers>=5.2.0",
    "uvicorn[standard]>=0.52.1",
    "vllm>=0.26.0",
]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "setuptools"]
